<!DOCTYPE html>
<html lang="zh-CN" data-theme="classic">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#FAF9F5" id="tcolor">
<title>对话</title>
<script>
/* 尽早套用皮肤，打开时不会先闪一下默认配色 */
try{
  var h=document.documentElement, L=JSON.parse(localStorage.getItem("c.look")||"null"), old=localStorage.getItem("c.theme");
  var t=(L&&L.theme)||((old==="dark"||(!old&&matchMedia("(prefers-color-scheme: dark)").matches))?"dark":"classic");
  h.setAttribute("data-theme",t);
  if(/^(taro|forest|sakura|snow)$/.test(t))h.setAttribute("data-deco","1");
}catch(e){}
</script>
<style>
/* ================= 配色：每套皮肤一组变量 ================= */
:root,[data-theme="classic"]{
  --bg:#FAF9F5; --panel:#F0EEE6; --sunk:#E9E6DC; --line:#DEDBD0;
  --ink:#1F1E1C; --ink-soft:#5F5D56; --ink-faint:#918F86;
  --accent:#C96442; --accent-hi:#D97757; --on-accent:#FFFFFF;
  --user-bg:#F0EEE6; --field:#FFFFFF; --danger:#B4402C; --pop:#FFFFFF;
  --glass:rgba(250,249,245,.9); --sel:rgba(201,100,66,.2);
  --note-tint:#FFF1A6; --note-ink:#4A3F17;
}
[data-theme="dark"]{
  --bg:#262624; --panel:#30302E; --sunk:#3B3B38; --line:#45443F;
  --ink:#F5F4EF; --ink-soft:#B2B0A8; --ink-faint:#86847C;
  --accent:#D97757; --accent-hi:#E08B6E; --on-accent:#221F1D;
  --user-bg:#3A3935; --field:#30302E; --danger:#E08472; --pop:#363634;
  --glass:rgba(38,38,36,.9); --sel:rgba(217,119,87,.3);
  --note-tint:#5C5435; --note-ink:#F3EBCB;
}
[data-theme="taro"]{
  --bg:#F6F0FC; --panel:#ECE1F8; --sunk:#E1D2F2; --line:#D6C4EC;
  --ink:#372A4B; --ink-soft:#655487; --ink-faint:#9786B4;
  --accent:#8B68C6; --accent-hi:#A285D6; --on-accent:#FFFFFF;
  --user-bg:#E4D3F7; --field:#FDFAFF; --danger:#C24672; --pop:#FFFFFF;
  --glass:rgba(246,240,252,.8); --sel:rgba(139,104,198,.25);
  --note-tint:#EBDDFB; --note-ink:#3F2B5E;
}
[data-theme="forest"]{
  --bg:#EEF4E9; --panel:#E1EBD8; --sunk:#D3E2C8; --line:#C5D7B8;
  --ink:#213020; --ink-soft:#4A5E43; --ink-faint:#7B8E73;
  --accent:#4E8B4A; --accent-hi:#64A05E; --on-accent:#FFFFFF;
  --user-bg:#D3E8C8; --field:#FAFCF7; --danger:#B4523C; --pop:#FFFFFF;
  --glass:rgba(238,244,233,.8); --sel:rgba(78,139,74,.22);
  --note-tint:#DDF0CC; --note-ink:#2D4A22;
}
[data-theme="sakura"]{
  --bg:#FFF4F7; --panel:#FDE5EC; --sunk:#F9D6E1; --line:#F2C6D4;
  --ink:#4A2C37; --ink-soft:#85606E; --ink-faint:#B38E9B;
  --accent:#D4608A; --accent-hi:#E27B9F; --on-accent:#FFFFFF;
  --user-bg:#FBD9E5; --field:#FFFBFC; --danger:#C2414F; --pop:#FFFFFF;
  --glass:rgba(255,244,247,.8); --sel:rgba(212,96,138,.22);
  --note-tint:#FFE0EB; --note-ink:#5A2A3A;
}
[data-theme="snow"]{
  --bg:#F0F6FB; --panel:#E1ECF6; --sunk:#D3E3F0; --line:#C5D8E9;
  --ink:#1D2B3A; --ink-soft:#4A5E75; --ink-faint:#8194A9;
  --accent:#3F84BC; --accent-hi:#5A9BD0; --on-accent:#FFFFFF;
  --user-bg:#D5E7F6; --field:#FBFDFF; --danger:#C0484F; --pop:#FFFFFF;
  --glass:rgba(240,246,251,.8); --sel:rgba(63,132,188,.22);
  --note-tint:#DCEBFA; --note-ink:#1F3B57;
}
:root{
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,"Noto Sans Mono CJK SC",monospace;
}

/* ================= 基础 ================= */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background-color:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.72;overflow:hidden;-webkit-font-smoothing:antialiased}
[data-deco] body{background-image:var(--wall);background-size:180px 180px}
button,input,textarea,select{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
::selection{background:var(--sel)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px}
::-webkit-scrollbar-track{background:transparent}
[data-deco] ::-webkit-scrollbar-thumb{background:var(--accent-hi)}
.grow{flex:1}
.app{display:flex;flex-direction:column;height:100dvh;position:relative;z-index:1}

/* 飘落动画层 */
.fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.fx span{position:absolute;top:0;display:block;animation:fall linear infinite;will-change:transform}
.fx i{display:block;width:100%;height:100%;background:center/contain no-repeat;animation:sway ease-in-out infinite alternate}
@keyframes fall{from{transform:translate3d(0,-14vh,0) rotate(0deg)}to{transform:translate3d(var(--dx),112vh,0) rotate(var(--rot))}}
@keyframes sway{from{transform:translateX(-14px)}to{transform:translateX(14px)}}

/* ================= 顶栏 ================= */
.top{display:flex;align-items:center;gap:4px;flex:0 0 auto;z-index:20;position:relative;padding:max(8px,env(safe-area-inset-top)) 10px 8px;background:var(--glass)}
[data-deco] .top,[data-deco] .composer,.mtop{-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ib{width:36px;height:36px;display:grid;place-items:center;border-radius:9px;color:var(--ink-soft);flex:0 0 auto;position:relative}
.ib:hover{background:var(--panel);color:var(--ink)}
.ib svg{width:19px;height:19px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ib.dot::after{content:"";position:absolute;top:6px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 2px var(--bg)}
#title{flex:1;min-width:0;font-size:14.5px;font-weight:500;color:var(--ink-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;padding:6px 4px;border-radius:7px}
#title:hover{background:var(--panel);color:var(--ink)}
#chip{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--ink-soft);border:1px solid var(--line);border-radius:20px;padding:5px 8px 5px 11px;white-space:nowrap;max-width:40vw;background:var(--field);flex:0 1 auto;min-width:0}
#chip span{overflow:hidden;text-overflow:ellipsis}
#chip svg{width:13px;height:13px;flex:0 0 auto;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
#chip:hover,#chip.held{border-color:var(--accent);color:var(--accent)}

/* ================= 消息 ================= */
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain}
.thread{max-width:730px;margin:0 auto;padding:18px 16px 12px}
.msg{margin-bottom:18px;animation:in .28s ease both}
@keyframes in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
.msg.user{display:flex;flex-direction:column;align-items:flex-end}
.msg.user .body{background:var(--user-bg);color:var(--ink);padding:11px 16px;border-radius:16px;max-width:84%;white-space:pre-wrap;word-break:break-word}
.msg.bot .body{word-break:break-word}
.msg.bot .body>*:first-child{margin-top:0}
.msg.bot .body>*:last-child{margin-bottom:0}
.msg.err .body{color:var(--danger);font-size:14px;background:var(--panel);padding:11px 15px;border-radius:12px}
.body p{margin:0 0 .85em}
.body h1,.body h2,.body h3,.body h4{line-height:1.4;margin:1.5em 0 .5em;font-weight:600}
.body h1{font-size:1.24em}.body h2{font-size:1.12em}.body h3,.body h4{font-size:1.02em}
.body ul,.body ol{margin:0 0 .85em;padding-left:1.45em}
.body li{margin:.22em 0}
.body blockquote{margin:.9em 0;padding-left:15px;border-left:2px solid var(--line);color:var(--ink-soft)}
.body a{color:var(--accent);text-underline-offset:2px}
.body hr{border:0;border-top:1px solid var(--line);margin:1.5em 0}
.body code.inl{font-family:var(--mono);font-size:.85em;background:var(--panel);padding:2px 5px;border-radius:4px}
.msg.user .body code.inl{background:rgba(127,127,127,.16)}
.body table{border-collapse:collapse;margin:.9em 0;font-size:.92em;display:block;overflow-x:auto;max-width:100%}
.body th,.body td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
.body th{background:var(--panel);font-weight:600;white-space:nowrap}
.code{margin:1em 0;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.code .hd{display:flex;align-items:center;justify-content:space-between;padding:5px 7px 5px 12px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
.code .hd button{font-size:11px;color:var(--ink-faint);padding:3px 8px;border-radius:5px}
.code .hd button:hover{background:var(--sunk);color:var(--ink)}
.code pre{margin:0;padding:12px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.6}
.think{margin:0 0 1em;padding:10px 14px;border-radius:10px;background:var(--panel);color:var(--ink-faint);font-size:13px;line-height:1.65;white-space:pre-wrap;max-height:190px;overflow-y:auto}
.caret{display:inline-block;width:7px;height:1.05em;vertical-align:-2px;background:var(--accent);margin-left:2px;animation:bl 1.1s steps(2) infinite}
@keyframes bl{50%{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
/* 回复里的便签操作 */
.mchip{display:inline-flex;align-items:center;gap:7px;margin:.2em 0 .9em;padding:7px 14px 7px 10px;border-radius:4px 4px 12px 4px;background:var(--note-tint);color:var(--note-ink);font-size:13.5px;line-height:1.4;box-shadow:0 6px 12px -8px rgba(0,0,0,.4);transform:rotate(-.6deg)}
.mchip svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.mchip.pending{animation:pulse 1.3s ease-in-out infinite}
.mchip.bad{background:var(--panel);color:var(--danger);transform:none;box-shadow:none}
@keyframes pulse{50%{opacity:.5}}
/* 消息下面的小按钮 */
.mrow{display:flex;align-items:center;gap:2px;margin:3px 0 0 -7px;min-height:30px;max-width:100%}
.ab{width:30px;height:30px;display:grid;place-items:center;border-radius:7px;color:var(--ink-faint);flex:0 0 auto}
.ab:hover{background:var(--panel);color:var(--ink)}
.ab svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ab:disabled{opacity:.3;cursor:default}
.ab:disabled:hover{background:none;color:var(--ink-faint)}
.mtag{margin-left:6px;min-width:0;font-family:var(--mono);font-size:11px;color:var(--ink-faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vrow{display:flex;align-items:center;gap:2px;margin:3px -7px 0 0;color:var(--ink-faint);font-size:12.5px;font-variant-numeric:tabular-nums}
.vrow[hidden]{display:none}
.vrow .ab svg{width:16px;height:16px}
/* 手机上长按消息弹菜单，所以关掉浏览器自带的长按选字；要选字用菜单里的「选择文本」 */
@media (pointer:coarse){.msg .body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}}
.msg .body{transition:background-color .15s,box-shadow .15s,filter .15s}
.msg.user .body.held{filter:brightness(.93)}
.msg.bot .body.held{background-color:var(--panel);border-radius:8px;box-shadow:0 0 0 8px var(--panel)}
/* 编辑 */
.msg.user.editing{align-items:stretch}
.msg.user.editing .body{max-width:none!important;background:var(--field)!important;color:var(--ink)!important;border:1px solid var(--ink-faint)!important;border-radius:16px!important;transform:none!important;box-shadow:none!important;filter:none!important;margin-top:0!important;white-space:normal;padding:10px 12px 10px 16px!important}
.msg.user.editing .body::before,.msg.user.editing .body::after{display:none!important}
.ed{display:block;width:100%;border:0;background:none;resize:none;outline:none;padding:2px 0;line-height:1.6;max-height:50vh;-webkit-user-select:text;user-select:text}
.ed-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:8px}
.btn{padding:8px 16px;border-radius:9px;font-size:14px;white-space:nowrap}
.btn.ghost{color:var(--ink-soft)}
.btn.ghost:hover{background:var(--panel)}
.btn.primary{background:var(--accent);color:var(--on-accent);font-weight:500}
.btn.primary:hover{background:var(--accent-hi)}
.btn.danger{color:var(--danger)}
.btn[hidden]{display:none}

/* 空状态 */
.blank{display:grid;place-items:center;min-height:48dvh}
.blank button{border:1px solid var(--line);border-radius:10px;padding:10px 20px;font-size:14px;color:var(--ink-soft);background:var(--field)}
.blank button:hover{border-color:var(--accent);color:var(--accent)}
.hello{display:none}
[data-deco] .hello{display:block;width:150px;height:130px;margin:20dvh auto 0;background:var(--motif) 50% 10%/62px no-repeat,var(--motif2) 14% 80%/42px no-repeat,var(--motif2) 88% 70%/34px no-repeat,var(--motif) 44% 98%/22px no-repeat;animation:float 7s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px) rotate(3deg)}}

/* ================= 输入框 ================= */
.composer{flex:0 0 auto;background:var(--glass);padding:6px 14px calc(12px + env(safe-area-inset-bottom));position:relative}
.inner{max-width:730px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;border:1px solid var(--line);border-radius:18px;background-color:var(--field);padding:7px 7px 7px 15px;transition:border-color .18s;position:relative}
.inner:focus-within{border-color:var(--ink-faint)}
#input{flex:1;border:0;background:none;resize:none;outline:none;padding:7px 0;max-height:42vh;line-height:1.6}
#input::placeholder{color:var(--ink-faint)}
.send{width:34px;height:34px;border-radius:50%;background:var(--accent);display:grid;place-items:center;flex:0 0 auto;transition:.18s;position:relative}
.send svg{width:16px;height:16px;stroke:var(--on-accent);stroke-width:2.2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.send:hover:not(:disabled){background-color:var(--accent-hi)}
.send:disabled{background-color:var(--sunk);cursor:default}
.send:disabled svg{stroke:var(--ink-faint)}
.send.stop svg{fill:var(--on-accent);stroke:none}

/* ================= 抽屉 / 遮罩 ================= */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);opacity:0;pointer-events:none;transition:opacity .22s;z-index:40}
.mask.on{opacity:1;pointer-events:auto}
.mask.top{z-index:58}
.drawer{position:fixed;top:0;left:0;bottom:0;width:min(285px,80vw);z-index:50;background-color:var(--panel);transform:translateX(-100%);transition:transform .26s cubic-bezier(.3,.8,.3,1);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
[data-deco] .drawer{background-image:var(--wall);background-size:180px 180px}
.drawer.on{transform:none}
.drawer .hd{padding:14px 14px 8px;position:relative}
.drawer .hd button{width:100%;text-align:left;padding:9px 11px;border-radius:9px;font-size:14px;color:var(--ink);background-color:var(--sunk)}
.drawer .hd button:hover{background-color:var(--line)}
.list{flex:1;overflow-y:auto;padding:4px 8px 10px}
.conv{display:flex;align-items:center;gap:6px;padding:9px 12px;border-radius:9px;cursor:pointer;color:var(--ink-soft);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;transition:background .15s}
.conv:hover{background:var(--sunk)}
.conv.on{background:var(--sunk);color:var(--ink)}
.conv.held{background:var(--line)}
.conv .t{flex:1;min-width:0;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .pin{display:grid;place-items:center;color:var(--ink-faint);flex:0 0 auto}
.conv .pin svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.drawer .ft{border-top:1px solid var(--line);padding:10px 14px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:2px}
.drawer .ft button{font-size:13px;color:var(--ink-soft);text-align:left;padding:7px 10px;border-radius:8px}
.drawer .ft button:hover{background:var(--sunk);color:var(--ink)}
.drawer .ft .danger:hover{color:var(--danger)}

/* ================= 弹出菜单 ================= */
.cmenu{position:fixed;z-index:70;min-width:172px;max-width:calc(100vw - 16px);max-height:min(72dvh,560px);overflow-y:auto;background-color:var(--pop);border-radius:16px;padding:6px;box-shadow:0 0 0 1px var(--line),0 14px 40px rgba(0,0,0,.19);display:flex;flex-direction:column;transform-origin:top right;animation:pop .14s ease-out}
.cmenu[hidden]{display:none}
@keyframes pop{from{opacity:0;transform:scale(.95)}}
.cmenu button{display:flex;align-items:center;gap:14px;text-align:left;padding:12px 16px;border-radius:11px;font-size:15px;flex:0 0 auto}
.cmenu button:hover,.cmenu button:active{background:var(--panel)}
.cmenu svg{width:20px;height:20px;stroke:currentColor;stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.cmenu .danger{color:var(--danger)}
.cmenu .cur{color:var(--accent)}
.cmenu .mh{padding:9px 16px 10px;margin:0 -6px 5px;border-bottom:1px solid var(--line);font-size:13px;color:var(--ink-faint);font-variant-numeric:tabular-nums;flex:0 0 auto}
.cmenu .sec{padding:10px 16px 2px;font-size:12px;color:var(--ink-faint);flex:0 0 auto}
.cmenu.mono button{padding:9px 16px;gap:10px}
.cmenu.mono button span{font-family:var(--mono);font-size:13.5px}
.cmenu.mono button.sans span{font-family:var(--sans);font-size:15px}
.cmenu.mono svg{width:17px;height:17px}

/* ================= 设置 / 便签编辑 弹窗 ================= */
.sheet{position:fixed;z-index:52;left:50%;top:50%;transform:translate(-50%,-46%);width:min(460px,94vw);max-height:90dvh;display:flex;flex-direction:column;background-color:var(--bg);border:1px solid var(--line);border-radius:18px;overflow:hidden;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;box-shadow:0 20px 55px rgba(0,0,0,.18)}
.sheet.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.sheet .sc{flex:1;overflow-y:auto;padding:16px 20px 6px;overscroll-behavior:contain}
.sheet .acts{display:flex;gap:6px;align-items:center;justify-content:flex-end;padding:12px 14px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);flex:0 0 auto}
.seg{display:flex;background-color:var(--panel);border-radius:12px;padding:3px;margin:16px 20px 0;flex:0 0 auto}
.seg button{flex:1;padding:8px;border-radius:9px;font-size:14px;color:var(--ink-soft)}
.seg button.on{background:var(--pop);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.field{margin-bottom:16px}
.field>label,.flabel{display:block;font-size:12px;color:var(--ink-faint);margin-bottom:7px}
.field input,.field textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;outline:none}
.field input:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:70px;line-height:1.6}
.field .tip{font-size:12px;color:var(--ink-faint);margin-top:6px}
.field .tip a{color:var(--accent)}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.tabs button{border:1px solid var(--line);border-radius:20px;padding:6px 13px;font-size:13px;color:var(--ink-soft);background:var(--field)}
.tabs button.on{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.tabs .k{display:inline-block;width:6px;height:6px;border-radius:50%;background:currentColor;margin-left:6px;vertical-align:2px;opacity:.55}
.mchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.mchips button{border:1px solid var(--line);border-radius:16px;padding:5px 11px;font-size:12.5px;font-family:var(--mono);color:var(--ink-soft);background:var(--field)}
.mchips button.on{border-color:var(--accent);color:var(--accent);background:var(--sel)}
.row2{display:flex;gap:11px}
.row2 .field{flex:1;min-width:0}
/* 外观：实时预览 + 皮肤卡片 */
.pv{border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:18px;background-color:var(--bg)}
[data-deco] .pv{background-image:var(--wall);background-size:180px 180px}
.pv-top{display:flex;align-items:center;gap:10px;height:34px;padding:0 13px;background:var(--glass);border-bottom:1px solid var(--line);position:relative}
.pv-top i{width:14px;height:2px;background:var(--ink-faint);box-shadow:0 -5px 0 var(--ink-faint),0 5px 0 var(--ink-faint);border-radius:2px}
.pv-top span{width:76px;height:8px;border-radius:4px;background:var(--line)}
.pvth{padding:18px 12px 4px;zoom:.86}
.pvth .msg,.bmini .msg{animation:none;margin-bottom:12px}
.pv-in{display:flex;align-items:center;gap:8px;margin:0 10px 10px;padding:6px 6px 6px 12px;border:1px solid var(--line);border-radius:14px;background-color:var(--field);position:relative}
.pv-in span{flex:1;height:8px;border-radius:4px;background:var(--sunk)}
.pv-in i{width:24px;height:24px;border-radius:50%;background:var(--accent)}
.tgrid,.bgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tcard,.bcard{display:flex;flex-direction:column;gap:6px;font-size:12.5px;color:var(--ink-soft);text-align:center;min-width:0}
.tcard.on,.bcard.on{color:var(--ink);font-weight:600}
.tframe,.bmini{display:block;border-radius:12px;border:2px solid var(--line);overflow:hidden;transition:border-color .15s,box-shadow .15s}
.tcard.on .tframe,.bcard.on .bmini{border-color:var(--accent);box-shadow:0 0 0 3px var(--sel)}
.tmini{display:block;height:78px;position:relative;background-color:var(--bg);background-image:var(--wall);background-size:120px 120px}
.tmini i{position:absolute;display:block}
.tmini .a{left:0;right:0;top:0;height:15px;background:var(--glass);border-bottom:1px solid var(--line)}
.tmini .b{right:8px;top:24px;width:48%;height:15px;border-radius:8px;background:var(--user-bg)}
.tmini .c{left:8px;top:46px;width:64%;height:5px;border-radius:3px;background:var(--ink-faint);opacity:.55}
.tmini .c2{left:8px;top:56px;width:42%;height:5px;border-radius:3px;background:var(--ink-faint);opacity:.55}
.tmini .d{right:7px;bottom:6px;width:13px;height:13px;border-radius:50%;background:var(--accent)}
.tmini .e{left:5px;bottom:4px;width:18px;height:18px;background:var(--motif) center/contain no-repeat}
.bmini{height:94px;background-color:var(--bg);padding:10px 8px 0;text-align:left;pointer-events:none}
[data-deco] .bmini{background-image:var(--wall);background-size:140px 140px}
.bmini .in{display:block;zoom:.62}
.bmini .msg{display:flex;flex-direction:column}
.bmini .msg.user{align-items:flex-end}
.bmini .body{display:block}
.sw{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 10px;font-size:14px;color:var(--ink);cursor:pointer;position:relative}
.sw.off{opacity:.45}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw i{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;transition:background .2s;flex:0 0 auto}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.sw input:checked+i{background:var(--accent)}
.sw input:checked+i::after{transform:translateX(18px)}
.sw input:focus-visible+i{outline:2px solid var(--accent);outline-offset:2px}

/* ================= 选择文本 ================= */
.selview{position:fixed;inset:0;z-index:80;background-color:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
.selview[hidden]{display:none}
.sv-top{display:flex;align-items:center;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:500;color:var(--ink-soft);flex:0 0 auto;position:relative}
.sv-body{flex:1;overflow-y:auto;padding:18px 20px calc(28px + env(safe-area-inset-bottom));font-size:16px;line-height:1.8;-webkit-user-select:text;user-select:text;word-break:break-word}
.sv-body.pre{white-space:pre-wrap}
.sv-body>*:first-child{margin-top:0}

/* ================= 便签墙 ================= */
.memo{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;background-color:var(--bg);background-image:radial-gradient(var(--line) 1.2px,transparent 1.5px);background-size:20px 20px;padding-top:env(safe-area-inset-top)}
[data-deco] .memo{background-image:var(--wall);background-size:180px 180px}
.memo[hidden]{display:none}
.mtop{display:flex;align-items:center;gap:6px;padding:8px 12px 8px 8px;background:var(--glass);flex:0 0 auto;position:relative;z-index:2}
.mtop h2{margin:0 0 0 2px;font-size:16px;font-weight:600}
.mcount{font-size:12.5px;color:var(--ink-faint)}
.aitog{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:6px 12px;border-radius:16px;border:1px solid var(--line);color:var(--ink-faint);background:var(--field)}
.aitog svg{width:13px;height:13px;fill:currentColor}
.aitog[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--sel)}
.board{flex:1;overflow-y:auto;padding:28px 16px calc(104px + env(safe-area-inset-bottom));columns:2;column-gap:16px}
@media (min-width:640px){.board{columns:3}}
@media (min-width:960px){.board{columns:4;padding-left:28px;padding-right:28px}}
.note{break-inside:avoid;display:block;width:100%;margin:0 0 24px;padding:20px 14px 11px;position:relative;cursor:pointer;background:var(--nc);color:var(--ni);border-radius:3px 3px 14px 3px;box-shadow:0 1px 1px rgba(0,0,0,.05),0 10px 18px -12px rgba(0,0,0,.42);transform:rotate(var(--rot));font-size:14.5px;line-height:1.62;word-break:break-word;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;text-align:left;transition:transform .2s}
.note:active{transform:rotate(var(--rot)) scale(.98)}
.note::before{content:"";position:absolute;top:-10px;left:50%;width:56px;height:19px;transform:translateX(-50%) rotate(var(--tape));background:rgba(255,255,255,.55);box-shadow:0 1px 3px rgba(0,0,0,.12)}
[data-theme="dark"] .note::before{background:rgba(255,255,255,.3)}
[data-deco] .note::before{width:26px;height:26px;top:-13px;background:var(--motif) center/contain no-repeat;box-shadow:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.note::after{content:"";position:absolute;right:0;bottom:0;width:20px;height:20px;border-radius:0 0 14px 0;background:linear-gradient(135deg,transparent 50%,rgba(0,0,0,.07) 50%)}
.note .nt>div{min-height:1.62em}
.note.multi .nt>div:first-child:not(.ck){font-weight:650}
.note .ck{display:flex;gap:8px;align-items:flex-start}
.note .ck .box{width:15px;height:15px;margin-top:.26em;border:1.6px solid currentColor;border-radius:4px;flex:0 0 auto;opacity:.65;position:relative;cursor:pointer}
.note .ck .box::before{content:"";position:absolute;inset:-9px}
.note .ck.on .box{background:currentColor;opacity:.7}
.note .ck.on .box::after{content:"";position:absolute;left:3.5px;top:.5px;width:4px;height:8px;border:solid var(--nc);border-width:0 2px 2px 0;transform:rotate(45deg)}
.note .ck.on span:last-child{text-decoration:line-through;opacity:.55}
.note .nf{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:10px;font-size:11px;opacity:.55}
.note .nai{display:inline-flex;align-items:center;gap:3px;font-weight:600}
.note .nai svg{width:11px;height:11px;fill:currentColor}
.note .npin{position:absolute;top:5px;right:7px;opacity:.5}
.note .npin svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}
.note.flash{animation:nflash 1s ease 2}
@keyframes nflash{50%{transform:rotate(var(--rot)) scale(1.05);box-shadow:0 0 0 3px var(--accent),0 14px 24px -12px rgba(0,0,0,.5)}}
.note.ghost{background:transparent;border:2px dashed var(--line);box-shadow:none;transform:rotate(-1.5deg);min-height:130px;display:grid;place-items:center;color:var(--ink-faint)}
.note.ghost::before,.note.ghost::after{display:none}
.note.ghost svg{width:28px;height:28px;stroke:currentColor;stroke-width:1.6;fill:none;stroke-linecap:round}
.fab{position:absolute;right:20px;bottom:calc(22px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);box-shadow:0 10px 24px -8px var(--accent);display:grid;place-items:center;z-index:3}
.fab svg{width:24px;height:24px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
/* 便签编辑 */
.ned{z-index:59;width:min(420px,94vw)}
.ncolors{display:flex;gap:11px;justify-content:center;padding:4px 0 16px}
.ncolors button{width:28px;height:28px;border-radius:50%;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.12);transition:transform .15s}
.ncolors button.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent);transform:scale(1.08)}
.npaper{background:var(--nc);color:var(--ni);border-radius:4px 4px 16px 4px;padding:16px;box-shadow:0 10px 22px -14px rgba(0,0,0,.5);margin-bottom:8px}
.npaper textarea{display:block;width:100%;min-height:180px;max-height:50dvh;border:0;background:transparent;color:inherit;resize:none;outline:none;font-size:15.5px;line-height:1.65}
.ned .acts .btn{padding:8px 11px}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));z-index:90;transform:translateX(-50%) translateY(8px);background:var(--ink);color:var(--bg);padding:9px 17px;border-radius:18px;font-size:13px;line-height:1.5;opacity:0;pointer-events:none;transition:.22s;width:max-content;max-width:min(88vw,420px);text-align:center}
.toast.on{opacity:1;transform:translateX(-50%)}

/* ================= 聊天气泡样式（data-b 挂在消息列表和预览上）================= */
[data-b="tail"] .msg.user .body{background:var(--accent);color:var(--on-accent);border-radius:20px 20px 6px 20px}
[data-b="tail"] .msg.user .body code.inl{background:rgba(255,255,255,.22)}
[data-b="tail"] .msg.bot .body{background:var(--pop);border:1px solid var(--line);border-radius:20px 20px 20px 6px;padding:11px 16px;width:fit-content;max-width:100%;box-shadow:0 4px 14px -10px rgba(0,0,0,.25)}
[data-b="pill"] .msg.user .body{background:linear-gradient(135deg,var(--accent),var(--accent-hi));color:var(--on-accent);border-radius:24px;padding:11px 20px;box-shadow:0 8px 18px -10px var(--accent)}
[data-b="pill"] .msg.user .body code.inl{background:rgba(255,255,255,.22)}
[data-b="pill"] .msg.bot .body{border-left:3px solid var(--accent-hi);padding:2px 0 2px 14px}
[data-b="line"] .msg.user .body{background:transparent;border:1.5px solid var(--accent);border-radius:18px}
[data-b="line"] .msg.bot .body{border:1.5px dashed var(--line);border-radius:18px;padding:12px 16px}
[data-b="note"] .msg.user .body{background:var(--note-tint);color:var(--note-ink);border-radius:3px 3px 14px 3px;transform:rotate(-1.2deg);box-shadow:0 10px 16px -12px rgba(0,0,0,.5);position:relative;margin-top:8px}
[data-b="note"] .msg.user .body::before{content:"";position:absolute;top:-10px;left:50%;width:48px;height:17px;transform:translateX(-50%) rotate(-3deg);background:rgba(255,255,255,.55);box-shadow:0 1px 2px rgba(0,0,0,.14)}
[data-theme="dark"] [data-b="note"] .msg.user .body::before{background:rgba(255,255,255,.25)}
[data-b="paper"] .msg.bot .body{background:var(--field);border-radius:6px;padding:14px 18px 14px 30px;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 20px -14px rgba(0,0,0,.3)}
[data-b="paper"] .msg.bot .body::before{content:"";position:absolute;left:16px;top:0;bottom:0;border-left:1.5px solid var(--danger);opacity:.35}
[data-b="paper"] .msg.user .body{background:var(--field);border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* ================= 主题装饰：香芋紫 / 森林 / 樱花 / 雪花 ================= */
[data-deco] .top::after,[data-deco] .sv-top::after,[data-deco] .mtop::after,[data-deco] .pv-top::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:16px;background:var(--motif) 4px 50%/24px 14px repeat-x;pointer-events:none;z-index:2}
[data-deco] .composer::before{content:"";position:absolute;left:0;right:0;top:-8px;height:16px;background:var(--motif2) 16px 50%/24px 14px repeat-x;pointer-events:none}
[data-deco] #title::before{content:"";display:inline-block;width:15px;height:15px;margin-right:6px;vertical-align:-2px;background:var(--motif) center/contain no-repeat}
[data-deco] .msg.user .body{position:relative}
[data-deco] .msg.user .body::after{content:"";position:absolute;top:-8px;left:-8px;width:20px;height:20px;background:var(--motif) center/contain no-repeat;transform:rotate(-18deg);pointer-events:none}
[data-deco] .msg.bot .body ul{list-style:none;padding-left:1.5em}
[data-deco] .msg.bot .body ul>li{position:relative}
[data-deco] .msg.bot .body ul>li::before{content:"";position:absolute;left:-1.35em;top:.38em;width:.95em;height:.95em;background:var(--motif) center/contain no-repeat}
[data-deco] .body hr{border:0;height:16px;background:var(--motif) center/26px 14px repeat-x;opacity:.85}
[data-deco] .body blockquote{border-left-color:var(--accent-hi)}
[data-deco] .caret{width:15px;height:15px;vertical-align:-3px;background:var(--motif) center/contain no-repeat;animation:spin 1.8s linear infinite}
[data-deco] .send::after{content:"";position:absolute;top:-6px;right:-6px;width:15px;height:15px;background:var(--motif2) center/contain no-repeat;pointer-events:none}
[data-deco] .inner::after{content:"";position:absolute;left:-7px;top:-9px;width:20px;height:20px;background:var(--motif) center/contain no-repeat;transform:rotate(-20deg);pointer-events:none}
[data-deco] .drawer .hd{padding-bottom:20px}
[data-deco] .drawer .hd::after{content:"";position:absolute;left:14px;right:14px;bottom:3px;height:14px;background:var(--motif2) 0 50%/22px 12px repeat-x}
[data-deco] .conv.on::after{content:"";width:14px;height:14px;flex:0 0 auto;background:var(--motif) center/contain no-repeat}
[data-deco] .cmenu::before{content:"";position:absolute;top:8px;right:10px;width:16px;height:16px;background:var(--motif) center/contain no-repeat;opacity:.8;pointer-events:none}
[data-deco] .sheet::before{content:"";position:absolute;top:8px;right:12px;width:22px;height:22px;background:var(--motif) center/contain no-repeat;transform:rotate(14deg);pointer-events:none;z-index:2}
[data-deco] .toast::before{content:"";display:inline-block;width:14px;height:14px;margin-right:6px;vertical-align:-2px;background:var(--motif) center/contain no-repeat}
[data-deco] .code .hd span::before{content:"";display:inline-block;width:11px;height:11px;margin-right:5px;vertical-align:-1px;background:var(--motif) center/contain no-repeat}
[data-deco] .fab::after{content:"";position:absolute;top:-6px;right:-4px;width:22px;height:22px;background:var(--motif2) center/contain no-repeat}
[data-deco] .pv-in::after{content:"";position:absolute;left:-6px;top:-8px;width:16px;height:16px;background:var(--motif) center/contain no-repeat;transform:rotate(-20deg)}
/* AI 的回复垫一层底色，背景图案和飘落的叶子、花瓣不会挡字；长按时颜色再深一点 */
[data-deco] [data-b] > .msg.bot > .body{background-color:var(--panel);border-radius:10px;box-shadow:0 0 0 10px var(--panel)}
[data-deco] [data-b] > .msg.bot > .mrow{margin-top:12px}
[data-deco] [data-b] > .msg.bot > .body.held{background-color:var(--sunk);box-shadow:0 0 0 10px var(--sunk)}
[data-deco] [data-b="line"] > .msg.bot > .body,[data-deco] [data-b="pill"] > .msg.bot > .body,
[data-deco] [data-b="line"] > .msg.bot > .body.held,[data-deco] [data-b="pill"] > .msg.bot > .body.held{box-shadow:none}
[data-deco] [data-b="pill"] > .msg.bot > .body{padding:10px 14px;border-radius:4px 12px 12px 4px}
[data-deco] [data-b="tail"] > .msg.bot > .body{background-color:var(--pop);box-shadow:0 4px 14px -10px rgba(0,0,0,.25)}
[data-deco] [data-b="paper"] > .msg.bot > .body{background-color:var(--field);box-shadow:0 1px 3px rgba(0,0,0,.08),0 8px 20px -14px rgba(0,0,0,.3)}
[data-deco] [data-b="tail"] > .msg.bot > .mrow,[data-deco] [data-b="paper"] > .msg.bot > .mrow,[data-deco] [data-b="line"] > .msg.bot > .mrow,[data-deco] [data-b="pill"] > .msg.bot > .mrow{margin-top:3px}
[data-deco] .msg.bot .body code.inl,[data-deco] .msg.bot .think,[data-deco] .msg.bot .body th{background-color:var(--sunk)}
[data-deco] .msg.bot .code{background-color:var(--field)}
/* 香芋紫：每个能填的地方都铺上小紫花 */
[data-theme="taro"] .msg.user .body,[data-theme="taro"] .inner,[data-theme="taro"] .sheet,[data-theme="taro"] .cmenu,[data-theme="taro"] .code .hd,[data-theme="taro"] .think,[data-theme="taro"] .seg,[data-theme="taro"] .drawer .hd button,[data-theme="taro"] .blank button,[data-theme="taro"] .pv-in,[data-theme="taro"] .mchip,[data-theme="taro"] .sv-body,[data-theme="taro"] .npaper{background-image:var(--soft);background-size:120px 120px}
[data-theme="taro"] [data-b="pill"] .msg.user .body{background-image:var(--soft),linear-gradient(135deg,var(--accent),var(--accent-hi));background-size:120px 120px,auto}
[data-theme="taro"] .send{width:40px;height:40px;margin:-3px -3px -3px 0;border-radius:0;background:var(--btnflower) center/100% 100% no-repeat}
[data-theme="taro"] .send:hover:not(:disabled){background:var(--btnflower) center/100% 100% no-repeat;filter:brightness(1.08)}
[data-theme="taro"] .send:disabled{background:var(--btnflower) center/100% 100% no-repeat;opacity:.42}
[data-theme="taro"] .send:disabled svg{stroke:#fff}
[data-theme="taro"] .send::after{display:none}
[data-theme="taro"] .pv-in i,[data-theme="taro"] .fab{border-radius:0;background:var(--btnflower) center/100% 100% no-repeat;box-shadow:none}
[data-theme="taro"] .fab{width:64px;height:64px;filter:drop-shadow(0 8px 12px rgba(139,104,198,.4))}
[data-theme="taro"] .fab::after{display:none}

@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}.fx{display:none}}
</style>
</head>
<body>
<div class="fx" id="fx" aria-hidden="true"></div>
<div class="app">
  <header class="top">
    <button class="ib" id="b-menu" aria-label="对话列表"><svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
    <button id="title"></button>
    <button id="chip" aria-label="切换模型"><span id="chip-t"></span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
    <button class="ib" id="b-memo" aria-label="便签"><svg viewBox="0 0 24 24"><path d="M5 4h14a1 1 0 0 1 1 1v9l-6 6H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z"/><path d="M20 14h-5a1 1 0 0 0-1 1v5M8 9h8M8 13h4"/></svg></button>
    <button class="ib" id="b-set" aria-label="设置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
  </header>
  <div class="scroll" id="scroll"><div class="thread" id="thread"></div></div>
  <div class="composer">
    <div class="inner">
      <textarea id="input" rows="1" placeholder="输入消息"></textarea>
      <button class="send" id="b-send" aria-label="发送"><svg viewBox="0 0 24 24" id="ico"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
    </div>
  </div>
</div>

<div class="mask" id="mask"></div>

<aside class="drawer" id="drawer">
  <div class="hd"><button id="b-new">＋ 新对话</button></div>

const SVG={

/* ================= 皮肤 ================= */
const svgDoc=(inner,w=20,h=20)=>`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${inner}</svg>`;
const cssURL=s=>`url("data:image/svg+xml,${encodeURIComponent(s)}")`;
function wallSVG(t,op){
  const M=MOTIF[t],P=PAL[t];
  return svgDoc(SPOTS.map(([x,y,s,r],i)=>`<g opacity="${op}" transform="translate(${x} ${y}) rotate(${r} ${s/2} ${s/2}) scale(${(s/20).toFixed(3)})">${M(P[i%P.length])}</g>`).join(""),180,180);
}
// 香芋紫的发送键和加号：一朵花
const FLOWER_BTN=svgDoc(`<g fill="#8B68C6"><circle cx="10" cy="5.4" r="4.2"/><circle cx="14.4" cy="8.6" r="4.2"/><circle cx="12.7" cy="13.8" r="4.2"/><circle cx="7.3" cy="13.8" r="4.2"/><circle cx="5.6" cy="8.6" r="4.2"/></g><circle cx="10" cy="10" r="4.6" fill="#7653B5"/>`);
const decoCache={};
function deco(t){
  if(!MOTIF[t])return null;
  if(decoCache[t])return decoCache[t];
  const M=MOTIF[t],P=PAL[t];
  const parts=t==="sakura"?[...P.map(c=>cssURL(svgDoc(PETAL(c)))),cssURL(svgDoc(M(P[0])))]:P.map(c=>cssURL(svgDoc(M(c))));
  return decoCache[t]={motif:cssURL(svgDoc(M(P[0]))),motif2:cssURL(svgDoc(M(P[1]))),wall:cssURL(wallSVG(t,WALL_OP[t])),soft:cssURL(wallSVG(t,.26)),parts};
}
function applyLook(L){
  const h=document.documentElement, d=deco(L.theme);
  h.dataset.theme=L.theme;
  if(d){

function falling(d,t){

/* ================= 弹层和返回键：手机上按返回先关最上面那层，而不是离开页面 ================= */
const layers=[]; let ignorePop=0; const waitPush=[];
function layerOpen(name,close){
  const L={name,close,h:false}; layers.push(L);
  const push=()=>{try{history.pushState({layer:name},"");L.h=true;}catch(_){}};

}
const isOpen=name=>layers.some(l=>l.name===name);
// 关掉 name 这一层，以及压在它上面的所有层
function closeTo(name){
  const k=layers.findIndex(l=>l.name===name); if(k<0)return;
  const gone=layers.splice(k); let n=0;
  for(let j=gone.length-1;j>=0;j--){if(gone[j].h)n++;gone[j].close();}
  if(n){ignorePop++;history.go(-n);}
}
addEventListener("popstate",()=>{

/* ================= Markdown ================= */
function inl(s){return s
  .replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>")
  .replace(/(^|[^*])\*([^*\n]+)\*/g,"$1<em>$2</em>")
  .replace(/~~([^~]+)~~/g,"<del>$1</del>")
  .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');}
const FENCE="```";
const MEMO_RE=/```memo[^\n]*\n([\s\S]*?)```/g;
function md(src,live){
  const B=[],I=[],M=[];
  // 便签操作块：写完的换成小卡片，正在生成的显示"正在整理"
  let s=String(src).replace(MEMO_RE,(m,b)=>{M.push(b);return "\n\u0000M"+(M.length-1)+"\u0000\n";});
  const mo=s.indexOf(FENCE+"memo"); if(mo>=0)s=s.slice(0,mo)+(live?"\n\u0000P\u0000\n":"");
  s=s.replace(/```([\w+.-]*)[ \t]*\r?\n?([\s\S]*?)```/g,(m,l,c)=>{B.push({l:l||"",c:c.replace(/\n$/,"")});return "\n\u0000B"+(B.length-1)+"\u0000\n";});
  // 还没闭合的代码块（生成中）也先按代码显示
  const uo=s.search(/(^|\n)```/);
  if(uo>=0){const st=s.indexOf(FENCE,uo),rest=s.slice(st+3),nl=rest.indexOf("\n"),l=(nl>=0?rest.slice(0,nl):rest).trim();
    B.push({l:/^[\w+.-]*$/.test(l)?l:"",c:nl>=0?rest.slice(nl+1):""});s=s.slice(0,st)+"\n\u0000B"+(B.length-1)+"\u0000\n";}
  const t=esc(s).replace(/`([^`\n]+)`/g,(m,c)=>{I.push(c);return "\u0000I"+(I.length-1)+"\u0000";});
  const Ls=t.split("\n"),out=[];let p=[],ls=null;
  const fp=()=>{if(p.length){out.push("<p>"+inl(p.join("<br>"))+"</p>");p=[];}};
  const fl=()=>{if(ls){out.push("</"+ls+">");ls=null;}};
  const isRow=x=>/^\s*\|.*\|\s*$/.test(x), isSep=x=>/^\s*\|?(\s*:?-{2,}:?\s*\|)+\s*(:?-{2,}:?\s*)?\|?\s*$/.test(x);
  const cells=x=>x.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(v=>inl(v.trim()));
  for(let k=0;k<Ls.length;k++){
    const ln=Ls[k].replace(/\s+$/,"");let m;
    if(/^\u0000[BMP]\d*\u0000$/.test(ln)){fp();fl();out.push(ln);continue;}
    if(!ln.trim()){fp();fl();continue;}
    if(isRow(ln)&&k+1<Ls.length&&isSep(Ls[k+1])){
      fp();fl();const head=cells(ln);k++;const rows=[];
      while(k+1<Ls.length&&isRow(Ls[k+1])){k++;rows.push(cells(Ls[k]));}
      out.push("<table><thead><tr>"+head.map(x=>"<th>"+x+"</th>").join("")+"</tr></thead><tbody>"+rows.map(r=>"<tr>"+r.map(x=>"<td>"+x+"</td>").join("")+"</tr>").join("")+"</tbody></table>");
      continue;
    }
    if(/^\s*[-*_]{3,}\s*$/.test(ln)){fp();fl();out.push("<hr>");continue;}
    if((m=ln.match(/^(#{1,4})\s+(.*)$/))){fp();fl();const n=m[1].length;out.push(`<h${n}>${inl(m[2])}</h${n}>`);continue;}
    if((m=ln.match(/^&gt;\s?(.*)$/))){fp();fl();out.push("<blockquote>"+inl(m[1])+"</blockquote>");continue;}
    if((m=ln.match(/^\s*[-*+]\s+(.*)$/))){fp();if(ls!=="ul"){fl();out.push("<ul>");ls="ul";}out.push("<li>"+inl(m[1])+"</li>");continue;}
    if((m=ln.match(/^\s*\d+[.)]\s+(.*)$/))){fp();if(ls!=="ol"){fl();out.push("<ol>");ls="ol";}out.push("<li>"+inl(m[1])+"</li>");continue;}
    fl();p.push(ln);
  }
  fp();fl();
  return out.join("\n")
    .replace(/\u0000B(\d+)\u0000/g,(x,i)=>{const b=B[+i];return `<div class="code"><div class="hd"><span>${esc(b.l||"code")}</span><button data-copy="${esc(b.c)}">复制</button></div><pre>${esc(b.c)}</pre></div>`;})
    .replace(/\u0000M(\d+)\u0000/g,(x,i)=>memoChip(M[+i]))
    .replace(/\u0000P\u0000/g,()=>`<span class="mchip pending">${SVG.note}<span>正在整理便签…</span></span>`)
    .replace(/\u0000I(\d+)\u0000/g,(x,i)=>'<code class="inl">'+esc(I[+i])+"</code>");
}

const nearBottom=()=>scroll.scrollHeight-scroll.scrollTop-scroll.clientHeight<160;
function toBottom(){requestAnimationFrame(()=>scroll.scrollTo({top:scroll.scrollHeight,behavior:"smooth"}));}
const canRegen=i=>{const c=cur(),u=c&&c.msgs[i-1];return !!(u&&u.role==="user");};
function mrow(m,i){
  return `<div class="mrow"><button class="ab" data-act="copy" aria-label="复制">${SVG.copy}</button>${canRegen(i)?`<button class="ab" data-act="regen" aria-label="重新生成">${SVG.regen}</button>`:""}<button class="ab" data-act="cut" aria-label="删除这条及之后">${SVG.del}</button>${m.model?`<span class="mtag">${esc(m.model)}</span>`:""}</div>`;
}
function vrow(m){

  return `<div class="vrow"><button class="ab" data-act="prev" aria-label="上一个版本"${k===0?" disabled":""}>${SVG.left}</button><span>${k+1} / ${n}</span><button class="ab" data-act="next" aria-label="下一个版本"${k===n-1?" disabled":""}>${SVG.right}</button></div>`;
}
// 助手消息下面是复制/重新生成/删除/模型名；用户消息只在有多个版本时显示版本切换
function arm(d,i,m){
  d.dataset.i=i;
  if(m.role==="assistant")d.insertAdjacentHTML("beforeend",mrow(m,i));
  else if(m.v&&m.v.length>1)d.insertAdjacentHTML("beforeend",vrow(m));
}
function renderFrom(c,i){
  const start=thread.querySelector(`.msg[data-i="${i}"]`);
  if(!start)return paint();
  for(let x=start;x;){const nx=x.nextElementSibling;x.remove();x=nx;}
  for(let k=i;k<c.msgs.length;k++){const m=c.msgs[k];const d=node(m.role,m.role==="user"?esc(m.content):md(m.content));arm(d,k,m);thread.appendChild(d);}
}
/* 版本：编辑过的用户消息在 m.v 里存着每个版本（连同它后面的整段对话），m.vi 是当前显示的版本。
   当前版本那一格存 null，它的内容就是 m.content 和 c.msgs 里后面的消息 */
function switchVer(c,i,j){
  const m=c.msgs[i];if(!m||!m.v||j<0||j>=m.v.length||j===m.vi)return;
  m.v[m.vi]={content:m.content,t:m.t,tail:c.msgs.slice(i+1)};
  const nv=m.v[j];m.v[j]=null;m.vi=j;m.content=nv.content;m.t=nv.t;
  c.msgs=c.msgs.slice(0,i+1).concat(nv.tail||[]);
  c.at=Date.now();save();
}
function branch(c,i,text){
  const m=c.msgs[i];
  if(!m.v){m.v=[null];m.vi=0;}
  m.v[m.vi]={content:m.content,t:m.t,tail:c.msgs.slice(i+1)};
  m.v.push(null);m.vi=m.v.length-1;m.content=text;m.t=Date.now();
  c.msgs=c.msgs.slice(0,i+1);
  c.at=Date.now();save();
}

/* ================= 请求 ================= */
// 合并相邻的同角色消息、跳过开头的助手消息：删过消息或请求失败后，历史不一定一问一答交替
function tidy(msgs){
  const out=[];
  for(const m of msgs){
    if(m.err||(!out.length&&m.role!=="user"))continue;
    const last=out[out.length-1];
    if(last&&last.role===m.role)last.content+="\n\n"+m.content;
    else out.push({role:m.role,content:m.content});
  }
  return out;
}
function memoGuide(){
  const list=sortedNotes().slice(0,80).map(n=>{const o={id:n.id,color:n.color,text:n.text.length>600?n.text.slice(0,600)+"…":n.text};if(n.pin)o.pin=true;return o;});
  return `【便签墙】用户有一面便签墙，你可以帮忙新增、修改、删除便签。现在是 ${new Date().toLocaleString("zh-CN",{hour12:false})}。当前便签（共 ${notes.length} 张）：
${JSON.stringify(list)}

要改动便签时，在回复里写一个语言标记为 memo 的代码块，内容是操作数组，例如：
${FENCE}memo
[{"op":"add","text":"周五前交报告","color":"yellow"},{"op":"edit","id":"n7k2","text":"- [x] 买牛奶\\n- [ ] 买面包"},{"op":"del","id":"n3x9"}]
${FENCE}
- op：add 新增；edit 修改（只写要改的字段）；del 删除。id 用上面列表里的
- color 可选：${NOTE_COLORS.map(c=>c.k).join(" / ")}；"pin":true 表示置顶
- 待办写成 "- [ ] 事项"，做完的写 "- [x] 事项"；第一行可以当标题
- 这个代码块会被自动执行并从对话里隐藏，正文用一句话说明改了什么就行，不要复述便签全文
- 只有用户想记录、整理、修改便签时才用；普通聊天不要动便签`;
}
function sysPrompt(){
  let s=opt.sys.trim();
  if(opt.memoAI)s=(s?s+"\n\n":"")+memoGuide();
  return s;
}
function build(msgs){
  const P=PROV[pid],a=acct(pid);
  const sys=sysPrompt(),max=Math.max(256,Math.min(64000,+opt.max||4096)),temp=Math.max(0,Math.min(2,+opt.temp));
  if(P.k==="anthropic"){
    const b={model:a.model,max_tokens:max,temperature:Math.min(1,temp),stream:true,messages:msgs};
    if(sys)b.system=sys;
    return {url:a.url||P.u,headers:{"content-type":"application/json","x-api-key":a.key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},body:b};
  }
  if(P.k==="gemini"){
    const b={contents:msgs.map(m=>({role:m.role==="assistant"?"model":"user",parts:[{text:m.content}]})),generationConfig:{maxOutputTokens:max,temperature:temp}};
    if(sys)b.systemInstruction={parts:[{text:sys}]};
    return {url:(a.url||P.u).replace("{m}",encodeURIComponent(a.model)),headers:{"content-type":"application/json","x-goog-api-key":a.key},body:b};
  }
  const list=sys?[{role:"system",content:sys}].concat(msgs):msgs;
  const b={model:a.model,messages:list,stream:true};
  // OpenAI 现在用 max_completion_tokens；推理模型（o 系列、gpt-5）不接受改温度
  if(pid==="openai"){b.max_completion_tokens=max;if(!/^(o\d|gpt-5)/i.test(a.model))b.temperature=temp;}
  else{b.max_tokens=max;b.temperature=temp;}
  return {url:a.url||P.u,headers:{"content-type":"application/json","authorization":"Bearer "+a.key},body:b};
}
function readEvent(ev,kind){
  let text="",think="",model="";
  if(kind==="anthropic"){
    if(ev.type==="message_start"&&ev.message&&typeof ev.message.model==="string")model=ev.message.model;
    if(ev.type==="content_block_delta"&&ev.delta){
      if(ev.delta.type==="text_delta")text=ev.delta.text||"";
      if(ev.delta.type==="thinking_delta")think=ev.delta.thinking||"";
    }
    if(ev.type==="error")throw new Error((ev.error&&ev.error.message)||"服务返回错误");
  }else if(kind==="gemini"){
    if(ev.error)throw new Error(ev.error.message||"服务返回错误");
    if(typeof ev.modelVersion==="string")model=ev.modelVersion;
    const parts=ev.candidates&&ev.candidates[0]&&ev.candidates[0].content&&ev.candidates[0].content.parts;
    if(parts)for(const p of parts){if(typeof p.text==="string"){if(p.thought)think+=p.text;else text+=p.text;}}
  }else{
    if(ev.error)throw new Error(ev.error.message||"服务返回错误");
    if(typeof ev.model==="string")model=ev.model;
    const d=ev.choices&&ev.choices[0]&&(ev.choices[0].delta||ev.choices[0].message);
    if(d){if(typeof d.content==="string")text=d.content;if(typeof d.reasoning_content==="string")think=d.reasoning_content;}
  }
  return {text,think,model};
}
function why(status,detail,pname){
  const d=detail?"："+detail:"";
  if(status===401||status===403)return pname+" 的 API Key 不对、失效或没权限"+d;
  if(status===402)return "余额不足"+d;
  if(status===404)return "模型名不存在，检查设置里的模型"+d;
  if(status===429)return "超出速率或额度限制，等一会儿再试"+d;
  if(status>=500)return pname+" 服务端出错（"+status+"）"+d;
  if(status===400&&/quota|balance|credit/i.test(detail))return "额度不足"+d;
  if(status===400)return "请求被拒绝"+d;
  return "请求失败 "+status+d;
}

function ready(){
  const a=acct(pid);
  if(!a.key){openSheet("model");toast("先填 "+PROV[pid].n+" 的 API Key");return false;}
  if(!a.model){openSheet("model");toast("先选一个模型");return false;}

}
async function send(){
  if(busy){if(ctrl)ctrl.abort();return;}
  const text=input.value.trim();if(!text)return;
  if(!ready())return;
  closeEditor();
  if(!cur())newConv();
  const c=cur();
  if(!c.msgs.length){c.title=text.replace(/\s+/g," ").trim().slice(0,24);c.mt=Date.now();}
  const um={role:"user",content:text,t:Date.now()};c.msgs.push(um);c.at=Date.now();
  input.value="";grow();
  if(thread.querySelector(".blank,.hello"))thread.innerHTML="";
  const un=node("user",esc(text));arm(un,c.msgs.length-1,um);thread.appendChild(un);
  save();plist();$("#title").textContent=c.title;
  reply(c);
}
/* 按 c.msgs 请求一条新回复，流式显示在最后 */
async function reply(c){
  const n=node("assistant",'<span class="caret"></span>'),body=n.querySelector(".body");
  thread.appendChild(n);toBottom();setBusy(true);
  let acc="",thk="",got="",raf=0;
  const view=live=>(thk?`<div class="think">${esc(thk)}</div>`:"")+md(acc,live);
  // 每帧最多重画一次；你往上翻看时不强行拉回底部
  const live=()=>{if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const stick=nearBottom();body.innerHTML=view(true)+'<span class="caret"></span>';if(stick)scroll.scrollTop=scroll.scrollHeight;});};
  const keep=()=>{const m={role:"assistant",content:acc,t:Date.now()};if(got)m.model=got;afterReply(m);c.msgs.push(m);c.at=Date.now();save();arm(n,c.msgs.length-1,m);};
  ctrl=new AbortController();
  try{
    const req=build(tidy(c.msgs));
    const res=await fetch(req.url,{method:"POST",signal:ctrl.signal,headers:req.headers,body:JSON.stringify(req.body)});
    if(!res.ok){
      let dt="";try{const e=await res.json();dt=(e.error&&(e.error.message||e.error.code))||(e.message||"");}catch(_){}
      throw new Error(why(res.status,dt,PROV[pid].n));
    }
    const rd=res.body.getReader(),dec=new TextDecoder();let buf="";
    for(;;){
      const {done,value}=await rd.read();if(done)break;
      buf+=dec.decode(value,{stream:true});
      const parts=buf.split(/\r?\n\r?\n/);buf=parts.pop();
      for(const ch of parts)for(const line of ch.split(/\r?\n/)){
        if(!line.startsWith("data:"))continue;
        const raw=line.slice(5).trim();
        if(!raw||raw==="[DONE]")continue;
        let ev;try{ev=JSON.parse(raw);}catch(_){continue;}
        const r=readEvent(ev,PROV[pid].k);
        if(r.model)got=r.model;
        if(r.think)thk+=r.think;
        if(r.text)acc+=r.text;
        if(r.think||r.text)live();
      }
    }
    cancelAnimationFrame(raf);raf=0;
    body.innerHTML=view(false);
    if(acc.trim())keep();
    else{n.classList.add("err");body.innerHTML="模型没有返回内容";}
  }catch(e){
    cancelAnimationFrame(raf);raf=0;
    if(e.name==="AbortError"){
      body.innerHTML=acc?view(false):(thk?`<div class="think">${esc(thk)}</div>`:"")+'<span style="color:var(--ink-faint)">已停止</span>';
      if(acc.trim())keep();
    }else{
      n.classList.add("err");
      body.innerHTML=esc(e instanceof TypeError?"连不上。检查网络，或这家接口不允许浏览器直连。":(e.message||"请求失败"));
    }
  }finally{setBusy(false);ctrl=null;plist();}
}
function afterReply(m){
  const r=applyMemo(m.content);
  if(!r)return;
  m.memo={ids:[...r.add,...r.edit]};
  const parts=[];
  if(r.add.length)parts.push("新增 "+r.add.length+" 张");
  if(r.edit.length)parts.push("修改 "+r.edit.length+" 张");
  if(r.del)parts.push("删除 "+r.del+" 张");
  toast((parts.length?"便签已更新："+parts.join("，"):"便签没有改动")+(r.bad?`（${r.bad} 项没执行）`:""));
}
function setBusy(v){
  busy=v;const b=$("#b-send");
  b.classList.toggle("stop",v);b.disabled=false;
  b.setAttribute("aria-label",v?"停止":"发送");
  $("#ico").innerHTML=v?'<rect x="7" y="7" width="10" height="10" rx="2.5"/>':'<path d="M12 19V5M5 12l7-7 7 7"/>';
  if(!v)grow();
}
function regen(i){
  if(busy)return toast("先停止生成");
  const c=cur(),u=c&&c.msgs[i-1];if(!u||u.role!=="user")return;
  if(!ready())return;
  closeEditor();branch(c,i-1,u.content);renderFrom(c,i-1);reply(c);
}

// 导入时只留认识的字段，编辑过的消息连同各个版本一起检查
function cleanMsgs(arr,depth){
  if(!Array.isArray(arr)||depth>60)return [];
  return arr.filter(m=>m&&(m.role==="user"||m.role==="assistant")&&typeof m.content==="string").map(m=>{
    const o={role:m.role,content:m.content};
    if(typeof m.model==="string")o.model=m.model;
    if(typeof m.t==="number")o.t=m.t;
    if(m.memo&&Array.isArray(m.memo.ids))o.memo={ids:m.memo.ids.filter(x=>typeof x==="string")};
    const v=m.v,k=m.vi;
    if(m.role==="user"&&Array.isArray(v)&&v.length>1&&Number.isInteger(k)&&k>=0&&k<v.length&&v.every((x,j)=>j===k||(x&&typeof x.content==="string"))){
      o.v=v.map((x,j)=>j===k?null:{content:x.content,t:typeof x.t==="number"?x.t:undefined,tail:cleanMsgs(x.tail,depth+1)});
      o.vi=k;
    }
    return o;
  });
}
function cleanNote(x){
  if(!x||typeof x.id!=="string"||typeof x.text!=="string")return null;
  return {id:x.id.slice(0,40),text:x.text.slice(0,4000),color:nColor(x.color).k,pin:x.pin===true,ct:+x.ct||+x.at||0,at:+x.at||0,by:x.by==="ai"?"ai":"me"};
}

$("#file").onchange=e=>{
  const f=e.target.files&&e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onerror=()=>toast("文件读不出来");
  r.onload=()=>{
    let data;
    try{data=JSON.parse(r.result);}catch(_){return toast("不是有效的 JSON 文件");}
    const list=Array.isArray(data)?data:(data&&Array.isArray(data.convs)?data.convs:null);
    if(!list)return toast("这个文件里没有对话记录");
    // 删除记录：两边删过的都不再出现，除非之后又被改动过
    if(data.dead&&typeof data.dead==="object")for(const [id,t] of Object.entries(data.dead))if(typeof t==="number"&&t>(dead[id]||0))dead[id]=t;
    if(data.ndead&&typeof data.ndead==="object")for(const [id,t] of Object.entries(data.ndead))if(typeof t==="number"&&t>(ndead[id]||0))ndead[id]=t;
    const gone=c=>dead[c.id]>=Math.max(c.at||0,c.mt||0), ngone=n=>ndead[n.id]>=(n.at||0);
    let add=0,upd=0,skip=0,rm=convs.length;
    convs=convs.filter(c=>!gone(c));rm-=convs.length;
    for(const c of list){
      if(!c||typeof c.id!=="string"||!Array.isArray(c.msgs)){skip++;continue;}
      const clean={id:c.id,title:String(c.title||"未命名"),at:+c.at||0,mt:+c.mt||0,pin:c.pin===true,msgs:cleanMsgs(c.msgs,0)};
      if(gone(clean))continue;
      const o=convs.find(x=>x.id===clean.id);
      if(!o){convs.push(clean);add++;continue;}
      // 消息和标题/置顶各自按最后改动时间取新的
      const takeMsgs=clean.at>(o.at||0);
      const takeMeta=clean.mt>(o.mt||0)||(takeMsgs&&clean.mt===(o.mt||0));
      if(takeMsgs){o.msgs=clean.msgs;o.at=clean.at;}
      if(takeMeta){o.title=clean.title;o.pin=clean.pin;o.mt=clean.mt;}
      if(takeMsgs||takeMeta)upd++;
    }
    let nAdd=0,nUpd=0,nRm=notes.length;
    notes=notes.filter(n=>!ngone(n));nRm-=notes.length;
    if(Array.isArray(data.notes))for(const x of data.notes){
      const n=cleanNote(x);if(!n||ngone(n))continue;
      const o=notes.find(y=>y.id===n.id);
      if(!o){notes.push(n);nAdd++;}else if(n.at>(o.at||0)){Object.assign(o,n);nUpd++;}
    }
    convs.sort((a,b)=>(b.at||0)-(a.at||0));
    J.set("c.dead",dead);saveNotes();
    if(!convs.length)newConv();
    else{if(!cur())curId=convs[0].id;save();paint();plist();}
    shut();
    const seg=[];
    if(add||upd||rm)seg.push(`对话：新增 ${add}，更新 ${upd}`+(rm?`，删除 ${rm}`:""));
    if(nAdd||nUpd||nRm)seg.push(`便签：新增 ${nAdd}，更新 ${nUpd}`+(nRm?`，删除 ${nRm}`:""));
    if(skip)seg.push(`跳过 ${skip} 个无法识别的对话`);
    toast(seg.join("；")||"没有需要更新的内容");
  };
  r.readAsText(f);
};

function copyText(t){
  const legacy=()=>new Promise((ok,no)=>{
    const ta=document.createElement("textarea");ta.value=t;ta.setAttribute("readonly","");
    ta.style.cssText="position:fixed;top:0;left:0;opacity:0;pointer-events:none";
    document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,t.length);
    let r=false;try{r=document.execCommand("copy");}catch(_){}
    ta.remove();r?ok():no();
  });
  return (navigator.clipboard&&window.isSecureContext)?navigator.clipboard.writeText(t).catch(legacy):legacy();
}

function cutFrom(d,i){

  const n=c.msgs.length-i,vs=m.v?m.v.length-1:0;

const nColor=k=>NOTE_COLORS.find(c=>c.k===k)||NOTE_COLORS[0];
function saveNotes(){J.set("c.notes",notes);J.set("c.ndead",ndead);}
function nid(){let id;do{id="n"+Math.random().toString(36).slice(2,6);}while(id.length<5||notes.some(n=>n.id===id)||ndead[id]);return id;}
function sortedNotes(){return notes.slice().sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||(b.ct||0)-(a.ct||0));}
function rotOf(id){let h=0;for(const ch of id)h=(h*31+ch.charCodeAt(0))|0;return ((Math.abs(h)%41)-20)/10;}
function fmtDay(t){const d=new Date(t||Date.now()),n=new Date();if(d.toDateString()===n.toDateString())return fmtTime(t);return (d.getFullYear()===n.getFullYear()?"":d.getFullYear()+"年")+(d.getMonth()+1)+"月"+d.getDate()+"日";}
function memoDot(on){
  if(on!==undefined){if(on)S.set("c.mdot","1");else S.del("c.mdot");}
  $("#b-memo").classList.toggle("dot",S.get("c.mdot")==="1");
}
function noteBody(t){
  return t.split("\n").map((ln,i)=>{
    const m=ln.match(/^\s*[-*]\s*\[( |x|X)\]\s?(.*)$/);
    if(m)return `<div class="ck${m[1]!==" "?" on":""}" data-line="${i}"><span class="box"></span><span>${esc(m[2])||"&nbsp;"}</span></div>`;
    return `<div>${esc(ln)||"&nbsp;"}</div>`;
  }).join("");
}
function noteHTML(n,fl){
  const c=nColor(n.color),r=rotOf(n.id);
  return `<div class="note${n.text.includes("\n")?" multi":""}${fl?" flash":""}" role="button" tabindex="0" data-id="${esc(n.id)}" style="--nc:${c.bg};--ni:${c.ink};--rot:${r}deg;--tape:${(-r*1.6).toFixed(1)}deg">${n.pin?`<span class="npin">${SVG.pin}</span>`:""}<div class="nt">${noteBody(n.text)}</div><div class="nf"><span>${fmtDay(n.at)}</span>${n.by==="ai"?`<span class="nai">${SVG.spark}AI</span>`:""}</div></div>`;
}
function renderBoard(flash){
  const list=sortedNotes(),b=$("#board");
  $("#memo-count").textContent=list.length?list.length+" 张":"";
  b.innerHTML=list.length?list.map(n=>noteHTML(n,flash&&flash.includes(n.id))).join(""):`<div class="note ghost" role="button" tabindex="0" data-new="1" aria-label="新建便签">${SVG.plus}</div>`;
  if(flash&&flash.length){const f=b.querySelector(".note.flash");if(f)f.scrollIntoView({block:"center"});}
}
function aiTog(){const b=$("#memo-ai");b.setAttribute("aria-pressed",opt.memoAI?"true":"false");b.innerHTML=SVG.spark+(opt.memoAI?"AI 可编辑":"AI 已关闭");}
function openMemo(flash){
  closeMenu();memoDot(false);
  const fl=(flash&&flash.length?flash:pendingFlash).filter(id=>notes.some(n=>n.id===id));pendingFlash=[];
  if(isOpen("memo"))return renderBoard(fl);
  $("#memo").hidden=false;aiTog();renderBoard(fl);
  layerOpen("memo",()=>{$("#memo").hidden=true;});
}
$("#b-memo").onclick=()=>openMemo();
$("#memo-back").onclick=()=>closeTo("memo");
$("#memo-add").onclick=()=>openNoteEd(null);
$("#memo-ai").onclick=()=>{opt.memoAI=!opt.memoAI;J.set("c.opt",opt);aiTog();toast(opt.memoAI?"AI 可以查看和修改便签了":"AI 现在看不到便签");};
$("#board").addEventListener("click",e=>{
  const el=e.target.closest(".note");if(!el)return;
  if(el.dataset.new)return openNoteEd(null);
  const n=notes.find(x=>x.id===el.dataset.id);if(!n)return;
  const bx=e.target.closest(".ck .box");
  if(bx)return toggleLine(n,+bx.parentElement.dataset.line,el);
  openNoteEd(n.id);
});
$("#board").addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.classList.contains("note")){e.preventDefault();e.target.click();}});
// 点待办前面的小方框直接勾选
function toggleLine(n,i,el){
  const L=n.text.split("\n"),m=L[i]&&L[i].match(/^(\s*[-*]\s*\[)( |x|X)(\].*)$/);if(!m)return;
  L[i]=m[1]+(m[2]===" "?"x":" ")+m[3];n.text=L.join("\n");n.at=Date.now();n.by="me";saveNotes();
  el.querySelector(".nt").innerHTML=noteBody(n.text);
}
function removeNote(n){notes=notes.filter(x=>x!==n);ndead[n.id]=Date.now();saveNotes();}
/* 便签编辑 */
function openNoteEd(id){
  const n=id&&notes.find(x=>x.id===id);
  draft=n?{id:n.id,color:n.color,pin:!!n.pin}:{id:null,color:NOTE_COLORS[notes.length%NOTE_COLORS.length].k,pin:false};
  $("#ntext").value=n?n.text:"";
  $("#n-del").hidden=!n;
  paintDraft();
  $("#noteEd").classList.add("on");$("#mask").classList.add("on","top");
  layerOpen("note",closeNoteEd);
  if(!n)setTimeout(()=>$("#ntext").focus(),80);
}
function paintDraft(){
  const c=nColor(draft.color),p=$("#npaper");
  p.style.setProperty("--nc",c.bg);p.style.setProperty("--ni",c.ink);
  $("#ncolors").innerHTML=NOTE_COLORS.map(x=>`<button data-c="${x.k}" style="--c:${x.bg}" class="${x.k===draft.color?"on":""}" aria-label="${x.n}色"></button>`).join("");
  $("#n-pin").textContent=draft.pin?"取消置顶":"置顶";
}
function closeNoteEd(){
  $("#noteEd").classList.remove("on");$("#mask").classList.remove("top");
  if(!isOpen("drawer")&&!isOpen("sheet"))$("#mask").classList.remove("on");
  const d=draft;draft=null;if(!d||d.deleted)return;
  const text=$("#ntext").value.replace(/\s+$/,"").slice(0,4000),now=Date.now();
  if(!d.id){
    if(!text.trim())return;
    const n={id:nid(),text,color:d.color,pin:d.pin,ct:now,at:now,by:"me"};
    notes.push(n);saveNotes();renderBoard([n.id]);return;
  }
  const n=notes.find(x=>x.id===d.id);if(!n)return;
  if(!text.trim()){removeNote(n);renderBoard();toast("内容清空了，这张便签已删除");return;}
  if(n.text!==text||n.color!==d.color||!!n.pin!==d.pin){n.text=text;n.color=d.color;n.pin=d.pin;n.at=now;n.by="me";saveNotes();renderBoard();}
}
$("#ncolors").onclick=e=>{const b=e.target.closest("[data-c]");if(!b||!draft)return;draft.color=b.dataset.c;paintDraft();};
$("#n-pin").onclick=()=>{if(!draft)return;draft.pin=!draft.pin;paintDraft();};
$("#n-done").onclick=()=>closeTo("note");
$("#n-del").onclick=()=>{
  if(!draft||!draft.id||!confirm("删除这张便签？"))return;
  const n=notes.find(x=>x.id===draft.id);if(n)removeNote(n);
  draft.deleted=true;closeTo("note");renderBoard();
};
$("#n-todo").onclick=()=>{
  const ta=$("#ntext"),s=ta.selectionStart,v=ta.value,ls=v.lastIndexOf("\n",s-1)+1;
  if(/^\s*[-*]\s*\[[ xX]\]/.test(v.slice(ls)))return ta.focus();
  ta.value=v.slice(0,ls)+"- [ ] "+v.slice(ls);ta.focus();ta.setSelectionRange(s+6,s+6);
};
// 待办行里按回车，自动接着写下一条待办；空的待办行按回车就结束列表
$("#ntext").addEventListener("keydown",e=>{
  if(e.key!=="Enter"||e.isComposing||e.shiftKey)return;
  const ta=e.target,s=ta.selectionStart,v=ta.value,ls=v.lastIndexOf("\n",s-1)+1,line=v.slice(ls,s);
  const m=line.match(/^(\s*[-*]\s*\[[ xX]\]\s?)(.*)$/);if(!m)return;
  e.preventDefault();
  if(!m[2].trim()){ta.value=v.slice(0,ls)+v.slice(s);ta.setSelectionRange(ls,ls);return;}
  const ins="\n- [ ] ";ta.value=v.slice(0,s)+ins+v.slice(ta.selectionEnd);ta.setSelectionRange(s+ins.length,s+ins.length);
});
/* AI 发来的便签操作 */
function parseOps(body){
  let d;try{d=JSON.parse(String(body).trim());}catch(_){return null;}
  if(d&&!Array.isArray(d)&&Array.isArray(d.ops))d=d.ops;
  if(d&&!Array.isArray(d)&&typeof d==="object"&&d.op)d=[d];
  if(!Array.isArray(d))return null;
  const list=d.filter(o=>o&&typeof o==="object"&&["add","edit","del"].includes(o.op));
  return {list,add:list.filter(o=>o.op==="add").length,edit:list.filter(o=>o.op==="edit").length,del:list.filter(o=>o.op==="del").length};
}
function memoChip(body){
  const r=parseOps(body);
  if(!r)return `<span class="mchip bad">${SVG.note}<span>便签指令格式不对，没有执行</span></span>`;
  const parts=[];if(r.add)parts.push("新增 "+r.add);if(r.edit)parts.push("修改 "+r.edit);if(r.del)parts.push("删除 "+r.del);
  return `<button class="mchip" data-memo="1">${SVG.note}<span>便签 · ${parts.join(" · ")||"没有改动"}</span></button>`;
}
function applyMemo(text){
  const blocks=[...String(text).matchAll(MEMO_RE)].map(x=>x[1]);
  if(!blocks.length)return null;
  const res={add:[],edit:[],del:0,bad:0};
  for(const blk of blocks){
    const p=parseOps(blk);if(!p){res.bad++;continue;}
    for(const o of p.list){
      const now=Date.now();
      if(o.op==="add"){
        const t=String(o.text||"").slice(0,4000);if(!t.trim()){res.bad++;continue;}
        const n={id:nid(),text:t,color:o.color?nColor(o.color).k:NOTE_COLORS[notes.length%NOTE_COLORS.length].k,pin:o.pin===true,ct:now,at:now,by:"ai"};
        notes.push(n);res.add.push(n.id);continue;
      }
      const n=notes.find(x=>x.id===String(o.id));if(!n){res.bad++;continue;}
      if(o.op==="del"){removeNote(n);res.del++;res.edit=res.edit.filter(x=>x!==n.id);continue;}
      if(typeof o.text==="string"&&o.text.trim())n.text=o.text.slice(0,4000);
      if(o.color)n.color=nColor(o.color).k;
      if(typeof o.pin==="boolean")n.pin=o.pin;
      n.at=now;n.by="ai";if(!res.edit.includes(n.id))res.edit.push(n.id);
    }
  }
  saveNotes();
  const ids=[...res.add,...res.edit];
  if(isOpen("memo"))renderBoard(ids);
  else if(res.add.length||res.edit.length||res.del){pendingFlash=ids;memoDot(true);}
  return res;
}

/* ================= 启动 ================= */
(function(){
  if(!PROV[pid])pid="gemini";

  if(!BUBBLES.some(b=>b[0]===look.bubble))look.bubble="simple";
  if(!Array.isArray(notes))notes=[];
  if(!convs.length){convs=[{id:uid(),title:"新对话",at:Date.now(),msgs:[]}];curId=convs[0].id;}
  if(!cur())curId=convs[0].id;
  applyLook(look);paint();plist();grow();memoDot();
})();
